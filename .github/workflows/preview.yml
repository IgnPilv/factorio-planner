# Publishes each pull request to https://ignpilv.github.io/factorio-planner/pr-preview/pr-<number>/
# and comments the link on the PR. Previews stay up after the PR is merged or
# closed, so a link shared for testing keeps working; deploy.yml keeps only the
# newest ones.
name: PR preview
on:
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: preview-${{ github.ref }}
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /factorio-planner/pr-preview/pr-${{ github.event.number }}/
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: deploy
